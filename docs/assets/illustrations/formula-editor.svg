<svg viewBox="0 0 500 335" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <!-- Panel background -->
  <rect width="500" height="335" fill="#14171B" rx="8"/>

  <!-- Chrome strip -->
  <rect width="500" height="36" rx="8" fill="#191E22"/>
  <rect y="28" width="500" height="8" fill="#191E22"/>
  <text x="14" y="23" fill="#C6CDD5" font-size="11.5" font-weight="600">Node Configuration</text>
  <circle cx="470" cy="18" r="11" fill="#101418"/>
  <text x="470" y="23.5" fill="#919BA6" font-size="17" text-anchor="middle" font-weight="300">+</text>

  <!-- Section chip -->
  <rect x="10" y="43" width="210" height="20" rx="10" fill="#101418" stroke="#242A30" stroke-width="1"/>
  <text x="20" y="57" fill="#919BA6" font-size="10">3 columns  ·  2 of 5 formulas</text>

  <!-- ══════════════════════════════════════
       FORMULA CARD 1  — SUCCESS state
       ══════════════════════════════════════ -->
  <rect x="8" y="70" width="484" height="118" rx="6" fill="#191E22" stroke="#242A30" stroke-width="1"/>

  <!-- Card 1 header -->
  <rect x="8" y="70" width="484" height="26" rx="6" fill="#1E242A"/>
  <rect x="8" y="84" width="484" height="12" fill="#1E242A"/>
  <text x="20" y="87" fill="#919BA6" font-size="10" font-weight="500">Section 1 of 2</text>
  <text x="453" y="88" fill="#5C6672" font-size="10" text-anchor="middle">✕</text>
  <text x="474" y="88" fill="#5C6672" font-size="11" text-anchor="middle">∧</text>

  <!-- Target column dropdown -->
  <text x="20" y="112" fill="#919BA6" font-size="9.5">Target</text>
  <rect x="60" y="101" width="175" height="22" rx="4" fill="#101418" stroke="#2F363D" stroke-width="1"/>
  <text x="70" y="116" fill="#C6CDD5" font-size="10.5">value_num</text>
  <text x="219" y="116" fill="#5C6672" font-size="9">▾</text>

  <!-- Data type dropdown -->
  <text x="252" y="112" fill="#919BA6" font-size="9.5">Type</text>
  <rect x="282" y="101" width="90" height="22" rx="4" fill="#101418" stroke="#2F363D" stroke-width="1"/>
  <text x="292" y="116" fill="#C6CDD5" font-size="10.5">Decimal</text>
  <text x="354" y="116" fill="#5C6672" font-size="9">▾</text>

  <!-- SQL editor (success) -->
  <rect x="20" y="130" width="460" height="36" rx="4" fill="#101418" stroke="#2F363D" stroke-width="1"/>
  <text y="152" font-size="11" font-family="'Consolas','Courier New',monospace">
    <tspan x="30" fill="#5BA8D6">TRY_CAST</tspan><tspan fill="#C6CDD5">(</tspan><tspan fill="#48A878">[order_value]</tspan><tspan fill="#5BA8D6"> AS </tspan><tspan fill="#D9A441">DOUBLE</tspan><tspan fill="#C6CDD5">)</tspan>
  </text>

  <!-- Success status -->
  <text x="20" y="183" fill="#48A878" font-size="10">✓  No errors — evaluates on the first 100 rows of preview data</text>

  <!-- Drag grip -->
  <line x1="210" y1="192" x2="290" y2="192" stroke="#2F363D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════
       FORMULA CARD 2  — ERROR state
       ══════════════════════════════════════ -->
  <rect x="8" y="206" width="484" height="118" rx="6" fill="#191E22" stroke="#242A30" stroke-width="1"/>

  <!-- Card 2 header -->
  <rect x="8" y="206" width="484" height="26" rx="6" fill="#1E242A"/>
  <rect x="8" y="220" width="484" height="12" fill="#1E242A"/>
  <text x="20" y="223" fill="#919BA6" font-size="10" font-weight="500">Section 2 of 2</text>
  <text x="453" y="224" fill="#5C6672" font-size="10" text-anchor="middle">✕</text>
  <text x="474" y="224" fill="#5C6672" font-size="11" text-anchor="middle">∧</text>

  <!-- Target column dropdown -->
  <text x="20" y="248" fill="#919BA6" font-size="9.5">Target</text>
  <rect x="60" y="237" width="175" height="22" rx="4" fill="#101418" stroke="#2F363D" stroke-width="1"/>
  <text x="70" y="252" fill="#C6CDD5" font-size="10.5">vendor_code</text>
  <text x="219" y="252" fill="#5C6672" font-size="9">▾</text>

  <!-- Data type dropdown -->
  <text x="252" y="248" fill="#919BA6" font-size="9.5">Type</text>
  <rect x="282" y="237" width="90" height="22" rx="4" fill="#101418" stroke="#2F363D" stroke-width="1"/>
  <text x="292" y="252" fill="#C6CDD5" font-size="10.5">Auto</text>
  <text x="354" y="252" fill="#5C6672" font-size="9">▾</text>

  <!-- SQL editor (error — red border) -->
  <rect x="20" y="266" width="460" height="36" rx="4" fill="#101418" stroke="#E0686C" stroke-width="1.5"/>
  <text y="288" font-size="11" font-family="'Consolas','Courier New',monospace">
    <tspan x="30" fill="#C6CDD5">[vendor] </tspan><tspan fill="#5BA8D6">+</tspan><tspan fill="#C6CDD5"> [id]</tspan>
  </text>

  <!-- Error status -->
  <text x="20" y="319" fill="#E0686C" font-size="10">✕  No function matches '+(VARCHAR, INTEGER)' — use || or CONCAT to join text</text>

  <!-- Drag grip -->
  <line x1="210" y1="328" x2="290" y2="328" stroke="#2F363D" stroke-width="2.5" stroke-linecap="round"/>
</svg>
