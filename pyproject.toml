[project]
name = "TriggerDesigner"
version = "0.0.1"
description = "A visual data processing tool with node-based workflow editor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Azad Kshitij", email = "azadkshitij08302001@gmail"}]

# Core dependencies organized by category
dependencies = [
    # Core data processing
    "polars[pyarrow]==1.33.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "duckdb>=1.2.1",
    
    # File handling
    "fastexcel>=0.15.1",
    "openpyxl>=3.1.0",
    "orjson==3.10.15",
    
    # GUI framework
    "pyqt6==6.8.0",
    "pyqt6-qt6==6.8.1",
    "pyqt6-sip==13.9.1",
    "qtpy==2.4.2",
    "nodeeditor @ git+https://github.com/AzadKshitij/qtpy-nodeeditor.git@main",
    
    # Visualization
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "pillow==11.2.1",
    
    # Performance and utilities
    "numba==0.61.0",
    "numexpr==2.10.2",
    "llvmlite==0.44.0",
    "psutil>=7.1.0",
    
    # Logging and CLI
    "loguru==0.7.3",
    "click==8.1.8",
    "colorama==0.4.6",
    
    # Standard utilities
    "packaging==24.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "six==1.17.0",
    "typing-extensions>=4.13.0",
    "tzdata==2025.1",
]

[tool.uv]
package = false


[tool.mypy]
python_version = "3.11"
exclude = "^.venv/ | build/ | dist/* | migrations/ | docs/ | /examples | /tests | ./dist/TriggerEditor/_internal/"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.ruff]
line-length = 88
target-version = "py311"


[dependency-groups]
dev = [
    "black>=25.9.0",
    "autotyping>=24.9.0",
    "faker>=37.1.0",
    "pandas-stubs>=2.2.3.250308",
    "pyinstaller>=6.12.0",
]
