[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TriggerDesigner"
version = "0.1.0"
description = "A visual data processing tool with node-based workflow editor"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
authors = [{name = "Azad Kshitij", email = "azadkshitij08302001@gmail.com"}]

# Core dependencies organized by category.
#
# Keep this list to packages the *application* imports. pandas, numba/llvmlite,
# numexpr and seaborn are intentionally absent: nothing under
# src/trigger_designer imports them, and PyInstaller excludes them from the
# bundle. pandas is gone from the dev group too (Phase 3): the preview test
# stubs it and scripts/Compare.py measures polars against the stdlib csv
# module. The savedfiles/ example pipelines that still import pandas are
# reference material for their workflows' goldens, not test inputs - re-run
# them with a one-off `uv add --dev pandas` if ever needed.
#
# pyarrow is NOT optional: DuckDB registers Polars frames by calling
# DataFrame.to_arrow(), which imports pyarrow. Dropping it breaks every
# SQL-backed Formula/Filter evaluation with "No module named 'pyarrow'".
dependencies = [
    # Core data processing
    "polars[pyarrow]==2.0.0",
    # Pinned (not floored) so the lock cannot jump majors silently. 26.0.0
    # is the post-upgrade pin; the [pyarrow] extra above only says
    # "pyarrow >= 7" on its own.
    "pyarrow==26.0.0",
    "numpy==2.5.4",
    # Floor raised, ceiling added: duckdb 2.0.0 is a new major and gets its
    # own phase (6); without `<2` any lock refresh would drift there silently.
    "duckdb>=1.5.6,<2",
    "sqlglot>=30.24,<31",
    # File handling
    "fastexcel>=0.21.0",
    "openpyxl>=3.1.5",
    "orjson==3.13.0",
    # GUI framework. The Qt trio is on the newest release because Python 3.14
    # has no wheels for the old pins (pyqt6-sip 13.9.1 falls back to a source
    # build); 6.11.x / sip 13.13.0 ship cp314/abi3 wheels. This bump was
    # planned for Phase 5 and pulled into Phase 1 for that reason.
    "pyqt6==6.11.0",
    "pyqt6-qt6==6.11.2",
    "pyqt6-sip==13.13.0",
    "qtpy==2.4.3",
    # Node canvas. Published on PyPI as `nodeeditor-qtpy`; the import package
    # is `nodeeditor`. No extras needed: the Qt binding (pyqt6) is already a
    # direct dependency above. qtpy>=2.4.3 is nodeeditor-qtpy's own floor.
    "nodeeditor-qtpy==0.8.2",
    # Visualization
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    # Performance and utilities
    "psutil>=7.2.2",
    # Logging
    "loguru==0.7.3",
]

[project.scripts]
trigger-designer = "trigger_designer.main:main"

[tool.uv]
# Installed (editable) into the venv so the `trigger-designer` console script
# exists and `uv run trigger-designer` starts the app. Editable, so resource
# files and the Qt resource modules still resolve from `src/` on disk.
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/trigger_designer"]


[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "scripts"]


[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.coverage.run]
source = ["trigger_designer"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Layers are marked automatically from the directory a test lives in
# (see tests/conftest.py); `--strict-markers` keeps a typo from silently
# creating an unselectable layer.
addopts = "-ra --strict-markers"
qt_api = "pyqt6"
# A hung test is the failure mode that used to make this suite look slow:
# one demo ran app.exec_() for ever. Per-test, with a thread dump on expiry.
timeout = 120
timeout_method = "thread"
markers = [
    "unit: logic tests - no widget layouts, no real windows",
    "ui: offscreen widget behaviour through pytest-qt",
    "e2e: checked-in workflow files loaded and run through the real app",
    "benchmark: memory or wall-clock measurements, skipped without --run-benchmarks",
    "slow: takes noticeably longer than the layer's typical test",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.2",
    "ty==0.0.91",
]
profiling = [
    "snakeviz==2.2.2",
    "py-spy==0.4.2",
    "memory-profiler==0.61.0",
]
