[project]
name = 'TriggerDesigner'
version = "0.0.1"
dependencies = [
    "click==8.1.8",
    "colorama==0.4.6",
    "duckdb>=1.2.1",
    "llvmlite==0.44.0",
    "loguru>=0.7.3",
    "nodeeditor @ git+https://github.com/AzadKshitij/qtpy-nodeeditor.git@main",
    "numba==0.61.0",
    "numexpr==2.10.2",
    "numpy==2.1.3",
    "orjson>=3.10.15",
    "packaging==24.2",
    "pandas==2.2.3",
    "pillow>=11.1.0",
    "pyqt6==6.8.0",
    "pyqt6-qt6==6.8.1",
    "pyqt6-sip==13.9.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "qtpy==2.4.2",
    "six==1.17.0",
    "tzdata==2025.1",
]

[tool.uv]
package = false


[tool.mypy]
python_version = ">3.11"
exclude = "^.venv/ | build/ | dist/* | migrations/ | docs/ | /examples | /tests | ./dist/TriggerEditor/_internal/"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[dependency-groups]
dev = [
    "autotyping>=24.9.0",
    "mypy>=1.15.0",
    "pyinstaller>=6.12.0",
]
