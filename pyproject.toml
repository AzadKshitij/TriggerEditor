[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TriggerDesigner"
version = "0.0.1"
description = "A visual data processing tool with node-based workflow editor"
readme = "README.md"
requires-python = ">=3.13.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Azad Kshitij", email = "azadkshitij08302001@gmail.com"}]

# Sync workflow (do NOT use bare `uv sync`): qtpy-nodeeditor is installed
# from git with --no-deps (see scripts/build.bat) and kept out of the lock,
# so a sync would prune it and break the GUI. Instead:
#   uv lock --upgrade-package <name>   # re-resolve into uv.lock
#   uv pip install --python .venv/Scripts/python.exe <name>==<version>
# Qt pins (pyqt6*, qtpy) are intentional; nodeeditor's metadata wants newer
# Qt, which is why it stays out of the lock.

# Core dependencies organized by category.
#
# Keep this list to packages the *application* imports. pandas, numba/llvmlite,
# numexpr and seaborn are intentionally absent: nothing under
# src/trigger_designer imports them, and PyInstaller excludes them from the
# bundle. pandas stays in the dev group for the preview tests and scripts.
#
# pyarrow is NOT optional: DuckDB registers Polars frames by calling
# DataFrame.to_arrow(), which imports pyarrow. Dropping it breaks every
# SQL-backed Formula/Filter evaluation with "No module named 'pyarrow'".
dependencies = [
    # Core data processing
    "polars[pyarrow]==1.44.2",
    # Pinned to the version the existing builds shipped; the extra above only
    # says "pyarrow >= 7", so without this the lock would silently jump to 26.
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "duckdb>=1.2.1",
    # File handling
    "fastexcel>=0.15.1",
    "openpyxl>=3.1.0",
    "orjson==3.12.0",
    # GUI framework
    "pyqt6==6.8.0",
    "pyqt6-qt6==6.8.1",
    "pyqt6-sip==13.9.1",
    "qtpy==2.4.2",
    # NOTE: qtpy-nodeeditor (git) is installed separately by scripts/build.bat,
    # which tracks the upstream `main` branch and installs with --no-deps; set
    # QTNODEEDITOR_REF to a SHA to pin. It must stay out of the uv lock because
    # its metadata requires newer pyqt6/qtpy than this project pins, and
    # `uv sync` prunes it - re-run scripts/build.bat (or
    # scripts/sync-nodeeditor.ps1) afterwards.
    # Visualization
    "matplotlib==3.11.2",
    "pillow==12.3.0",
    # Performance and utilities
    "psutil>=7.1.0",
    # Logging and CLI
    "loguru==0.7.3",
    "click==8.5.0",
    "colorama==0.4.6",
    # Standard utilities
    "packaging==26.3",
    "python-dateutil==2.9.0.post0",
    "typing-extensions>=4.13.0",
    "tzdata==2026.4",
]

[project.scripts]
trigger-designer = "trigger_designer.main:main"

[tool.uv]
# Installed (editable) into the venv so the `trigger-designer` console script
# exists and `uv run trigger-designer` starts the app. Editable, so resource
# files and the Qt resource modules still resolve from `src/` on disk.
# Only the *install* is affected - the lockfile still excludes
# qtpy-nodeeditor, so a sync will not prune it (see the note above).
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/trigger_designer"]


[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "scripts"]


[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.coverage.run]
source = ["trigger_designer"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Layers are marked automatically from the directory a test lives in
# (see tests/conftest.py); `--strict-markers` keeps a typo from silently
# creating an unselectable layer.
addopts = "-ra --strict-markers"
qt_api = "pyqt6"
# A hung test is the failure mode that used to make this suite look slow:
# one demo ran app.exec_() for ever. Per-test, with a thread dump on expiry.
timeout = 120
timeout_method = "thread"
markers = [
    "unit: logic tests - no widget layouts, no real windows",
    "ui: offscreen widget behaviour through pytest-qt",
    "e2e: checked-in workflow files loaded and run through the real app",
    "benchmark: memory or wall-clock measurements, skipped without --run-benchmarks",
    "slow: takes noticeably longer than the layer's typical test",
]

[dependency-groups]
dev = [
    "autotyping==24.9.0",
    "faker==40.39.0",
    # Tests and developer scripts still exercise the pandas preview path;
    # the application itself does not import pandas, so it is not bundled.
    "pandas==2.3.3",
    "pandas-stubs==2.3.3.260113",
    "pkgsizer>=0.1.1",
    "pre-commit==4.6.2",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
    "ty==0.0.84",
]
profiling = [
    "snakeviz==2.2.2",
    "py-spy==0.4.2",
    "memory-profiler==0.61.0",
]
